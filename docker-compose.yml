version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3008:3008"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8088
    depends_on:
      - backend
    restart: unless-stopped

